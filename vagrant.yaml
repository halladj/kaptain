# memory in MiB. cpu_cap: the percentage of a CPU each vCPU may use.
master: { name: master, cpus: 2, memory: 4096, experiment: false }
nodes:
  - { name: worker-fast,   cpus: 4, memory: 3072, cpu_cap: 100, experiment: true }
  # The Raspberry Pi 5: 4 cores, slower ones. The host's architecture here, and less memory than its 8 GB.
  - { name: worker-pi,     cpus: 4, memory: 2048, cpu_cap: 50,  experiment: true }
  - { name: worker-slow-1, cpus: 1, memory: 1536, cpu_cap: 50,  experiment: true }
  - { name: worker-slow-2, cpus: 1, memory: 1536, cpu_cap: 50,  experiment: true }

# The default takes about a day or more: shorten it for a first try.
campaign:
  experiments: even-5s even-10s
  strategies: kaptain earliest-finish shortest-estimate least-allocated default-scheduler
  seeds: 7 8 9 10 11
  train_runs: 10
  replicates: 3
  validate_every: 0
